<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Minh họa tài khoản khách và hỗ trợ</title>
  <rect width="960" height="420" rx="24" fill="#f3f4f6"/><rect x="22" y="22" width="916" height="376" rx="20" fill="#fff"/><rect x="22" y="22" width="916" height="52" rx="20" fill="#172554"/><text x="54" y="55" fill="#fff" font-family="Arial" font-size="15" font-weight="700">SEN VIỆT HOTELS</text><text x="686" y="54" fill="#dbeafe" font-family="Arial" font-size="10">VI / EN　◉ TÀI KHOẢN</text>
  <rect x="52" y="96" width="392" height="260" rx="15" fill="#f8fafc" stroke="#e2e8f0"/><circle cx="102" cy="145" r="28" fill="#dbeafe"/><circle cx="102" cy="138" r="8" fill="#1d4ed8"/><path d="M85 161c2-15 32-15 34 0" fill="#1d4ed8"/><text x="146" y="139" fill="#0f172a" font-family="Arial" font-size="13" font-weight="700">1 · TÀI KHOẢN KHÁCH HÀNG</text><text x="146" y="162" fill="#64748b" font-family="Arial" font-size="10">Hồ sơ · Đặt phòng · Hóa đơn</text>
  <g font-family="Arial" font-size="10" fill="#334155"><rect x="76" y="195" width="344" height="42" rx="9" fill="#fff"/><text x="96" y="221">Đặt phòng của tôi</text><rect x="76" y="248" width="344" height="42" rx="9" fill="#fff"/><text x="96" y="274">Hóa đơn và tích điểm</text><rect x="76" y="301" width="344" height="38" rx="9" fill="#fff"/><text x="96" y="325">Hồ sơ và mật khẩu</text></g>
  <rect x="470" y="96" width="438" height="260" rx="15" fill="#eff6ff" stroke="#bfdbfe"/><text x="496" y="134" fill="#1e3a8a" font-family="Arial" font-size="13" font-weight="700">2 · BẠN CẦN HỖ TRỢ?</text><rect x="496" y="154" width="386" height="72" rx="12" fill="#fff"/><circle cx="530" cy="190" r="20" fill="#fef3c7"/><path d="M521 190a9 9 0 0 1 18 0v6h-4v-6a5 5 0 0 0-10 0v6h-4z" fill="#92400e"/><text x="566" y="184" fill="#0f172a" font-family="Arial" font-size="11" font-weight="700">Mở kênh hỗ trợ</text><text x="566" y="204" fill="#64748b" font-family="Arial" font-size="9">Trò chuyện với trợ lý hoặc nhân viên</text>
  <rect x="496" y="242" width="386" height="88" rx="12" fill="#dbeafe"/><text x="520" y="272" fill="#1e3a8a" font-family="Arial" font-size="10" font-weight="700">3 · CHUYỂN NGÔN NGỮ</text><text x="520" y="296" fill="#334155" font-family="Arial" font-size="10">Nhãn giao diện đổi ngôn ngữ; tên riêng có thể giữ nguyên.</text><text x="520" y="316" fill="#64748b" font-family="Arial" font-size="9">Chuẩn bị mã booking khi cần liên hệ hỗ trợ.</text>
