<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title">
  <title id="title">Minh họa chọn ngày lưu trú và loại phòng</title>
  <rect width="960" height="420" rx="24" fill="#f3f4f6"/><rect x="22" y="22" width="916" height="376" rx="20" fill="#fff"/>
  <text x="52" y="62" fill="#0f172a" font-family="Arial" font-size="18" font-weight="700">CHỌN NGÀY LƯU TRÚ &amp; LOẠI PHÒNG</text>
  <rect x="52" y="82" width="856" height="62" rx="12" fill="#eff6ff"/><text x="72" y="108" fill="#1e3a8a" font-family="Arial" font-size="10" font-weight="700">1 · NGÀY NHẬN / NGÀY TRẢ</text><text x="72" y="129" fill="#334155" font-family="Arial" font-size="11">Chọn ngày · số khách · xem thông báo ngày tạm đóng</text>
  <g><rect x="52" y="162" width="856" height="84" rx="13" fill="#f8fafc" stroke="#e2e8f0"/><rect x="68" y="176" width="112" height="56" rx="8" fill="#cbd5e1"/><text x="202" y="197" fill="#0f172a" font-family="Arial" font-size="12" font-weight="700">2 · HẠNG PHÒNG &amp; SỨC CHỨA</text><text x="202" y="220" fill="#64748b" font-family="Arial" font-size="10">Tiện nghi · giá mỗi đêm · tình trạng phòng</text><text x="720" y="198" fill="#64748b" font-family="Arial" font-size="9">SỐ PHÒNG</text><text x="720" y="222" fill="#0f172a" font-family="Arial" font-size="12">−　1　+</text>
  <rect x="52" y="260" width="856" height="84" rx="13" fill="#f8fafc" stroke="#e2e8f0"/><rect x="68" y="274" width="112" height="56" rx="8" fill="#dbeafe"/><text x="202" y="296" fill="#0f172a" font-family="Arial" font-size="12" font-weight="700">3 · CHỌN SỐ LƯỢNG &amp; KHÁCH</text><text x="202" y="319" fill="#64748b" font-family="Arial" font-size="10">Xem tiện nghi và tổng tiền trước khi tiếp tục</text><text x="720" y="298" fill="#64748b" font-family="Arial" font-size="9">SỐ PHÒNG</text><text x="720" y="322" fill="#0f172a" font-family="Arial" font-size="12">−　0　+</text></g>
  <rect x="52" y="358" width="856" height="24" rx="8" fill="#fef3c7"/><text x="68" y="375" fill="#92400e" font-family="Arial" font-size="9">Không đặt được ngày tạm đóng / hết phòng? Hãy chọn ngày hoặc hạng phòng khác.</text>
</svg>
